<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroAtlas — An Interactive Guide to Neurology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1d1f23; --muted:#5f6670; --line:#e4e2dc; --soft:#f0eee9;
  --accent:#1971c2; --red:#c92a2a; --redbg:#fff1f0; --amber:#e67700; --amberbg:#fff8e6; --green:#2b8a3e; --greenbg:#eefaf0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --radius:12px; --serif:"Source Serif 4",Georgia,serif; --sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121417; --panel:#1a1d21; --ink:#e8e6e1; --muted:#a2a8b0; --line:#2c3036; --soft:#22262b;
  --redbg:#2a1717; --amberbg:#2a2214; --greenbg:#15241a; --shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;flex-shrink:0}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--serif);font-size:21px;letter-spacing:-.01em}
.brand span{display:block;font-size:11.5px;color:var(--muted);margin-top:-3px}
.search{position:relative;flex:1;max-width:560px;margin-left:auto}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.14);max-height:70vh;overflow:auto;display:none;z-index:40}
.results.show{display:block}
.res{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover,.res.on{background:var(--soft)}
.res b{display:block;font-weight:600}
.res small{color:var(--muted);font-size:12.5px}
.res mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;border-radius:2px}
.navbtn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;cursor:pointer}
.toplinks{display:flex;gap:4px}
.toplinks a{padding:7px 11px;border-radius:8px;text-decoration:none;font-size:14px;color:var(--muted);font-weight:500}
.toplinks a:hover,.toplinks a.on{background:var(--soft);color:var(--ink)}
.layout{display:grid;grid-template-columns:290px 1fr;max-width:1400px;margin:0 auto;min-height:calc(100vh - 60px)}
aside.side{border-right:1px solid var(--line);padding:16px 10px 40px 14px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.side h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 8px 8px}
.tarea{margin-bottom:2px}
.tarea>button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.tarea>button:hover{background:var(--soft)}
.tarea>button.on{background:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.chev{margin-left:auto;transition:transform .15s;color:var(--muted);font-size:11px}
.tarea.open .chev{transform:rotate(90deg)}
.tsub{display:none;padding:2px 0 6px 18px}
.tarea.open .tsub{display:block}
.tsub .sl{font-size:11.5px;color:var(--muted);margin:8px 8px 3px;font-weight:600}
.tsub a{display:block;padding:4px 8px;border-radius:6px;font-size:13.5px;text-decoration:none;color:var(--ink);opacity:.85}
.tsub a:hover{background:var(--soft);opacity:1}
.tsub a.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);opacity:1;font-weight:600}
main{padding:28px 36px 60px;min-width:0}
.wrap{max-width:980px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
h1{font-family:var(--serif);font-size:38px;line-height:1.12;margin:0 0 8px;letter-spacing:-.015em}
h2{font-family:var(--serif);font-size:24px;margin:34px 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.lede{font-size:17px;color:var(--muted);max-width:760px;margin:0 0 18px}
.aka{color:var(--muted);font-size:14px;margin:-2px 0 14px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font-size:44px}
.hero .stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.stat b{font-family:var(--serif);font-size:30px;display:block;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}
.hero svg.bg{position:absolute;right:-30px;top:-20px;width:300px;opacity:.09;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
a.card{text-decoration:none;display:block;transition:transform .12s,border-color .12s}
a.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c,var(--accent)) 55%,var(--line))}
.acard{border-top:4px solid var(--c)}
.acard b{font-family:var(--serif);font-size:18.5px;display:block;margin-bottom:4px;line-height:1.25}
.acard p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.acard .n{font-size:12px;font-weight:600;color:var(--c)}
.dcard b{display:block;font-weight:600;margin-bottom:3px}
.dcard p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dcard .badge{margin-top:8px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--amberbg);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.emerg{background:var(--redbg);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:14px;padding:16px 20px;margin:18px 0}
.emerg h3{color:var(--red);margin-bottom:10px;font-size:15px}
.befast{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.befast div{background:var(--panel);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.befast b{display:block;font-family:var(--serif);font-size:26px;color:var(--red);line-height:1}
.befast span{font-size:12px;font-weight:600;display:block;margin-top:2px}
.befast small{font-size:11px;color:var(--muted);display:block;line-height:1.3;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sec{scroll-margin-top:80px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.toc a{font-size:12.5px;text-decoration:none;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:500}
.toc a:hover{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
ul.clean{margin:0;padding-left:0;list-style:none}
ul.clean li{position:relative;padding:5px 0 5px 22px;border-bottom:1px dashed var(--line)}
ul.clean li:last-child{border-bottom:0}
ul.clean li::before{content:"";position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
.k-early{background:var(--amberbg);border-color:color-mix(in srgb,var(--amber) 28%,transparent)}
.k-early h3{color:var(--amber)}
.k-early li::before{background:var(--amber)!important}
.k-red{background:var(--redbg);border-color:color-mix(in srgb,var(--red) 28%,transparent)}
.k-red h3{color:var(--red)}
.k-red li::before{background:var(--red)!important}
.k-upd{background:var(--greenbg);border-color:color-mix(in srgb,var(--green) 28%,transparent)}
.k-upd h3{color:var(--green)}
.k-upd li::before{background:var(--green)!important}
.tx{margin-top:12px}
.txg{margin-bottom:12px}
.txg h3{display:flex;align-items:center;gap:8px;font-size:14.5px;padding-bottom:6px;border-bottom:2px solid color-mix(in srgb,var(--c) 30%,transparent)}
ol.refs{padding-left:22px;margin:0}
ol.refs li{margin-bottom:8px;font-size:14px}
ol.refs a{color:var(--accent);text-decoration:none;word-break:break-word}
ol.refs a:hover{text-decoration:underline}
.ext{font-size:11px;opacity:.7}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.pager a{flex:1;text-decoration:none}
.pager small{color:var(--muted);font-size:12px;display:block}
.subhead{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.subhead h2{margin:0}
.subhead span{color:var(--muted);font-size:13px}
.updlist .u{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.updlist .u:last-child{border:0}
.updlist time{font-size:13px;color:var(--muted);font-weight:600}
.updlist b{display:block}
.updlist a{color:var(--accent);font-size:13.5px;text-decoration:none;font-weight:500}
.newb{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:999px;background:var(--amber);color:#fff;margin-left:6px;vertical-align:2px;font-family:inherit}
.newb.big{font-size:12px;padding:3px 10px;vertical-align:6px;margin-left:12px;letter-spacing:0}
.checked{font-size:13.5px;color:var(--muted);margin:0 0 16px}
.checked a{color:var(--accent);text-decoration:none;font-weight:600}
.disc{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:46px;padding-top:16px}
.note{font-size:13px;color:var(--muted)}
.match{font-size:12px;color:var(--accent);font-weight:600}
.ddt{padding:0;overflow:hidden}
.ddrow{display:grid;grid-template-columns:1.1fr 1.2fr 1.6fr;gap:0;border-bottom:1px solid var(--line)}
.ddrow:last-child{border-bottom:0}
.ddrow>div{padding:11px 14px;font-size:14px}
.ddrow.head{background:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ddrow.head>div{font-size:11.5px;padding:9px 14px}
.ddrow .nm{font-weight:600}
.ddrow .nm a{color:var(--accent);text-decoration:none}
.ddrow .nm a:hover{text-decoration:underline}
.ddrow .sim{color:var(--muted)}
.ddrow .lab{display:none}
@media (max-width:900px){.ddrow{grid-template-columns:1fr}.ddrow.head{display:none}.ddrow>div{padding:4px 14px}.ddrow .nm{padding-top:12px}.ddrow>div:last-child{padding-bottom:12px}.ddrow .lab{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}}
.scrim{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside.side{position:fixed;left:0;top:0;height:100vh;width:300px;background:var(--panel);z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:20px}
  body.nav aside.side{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .navbtn{display:block}
  .toplinks{display:none}
  main{padding:20px 16px 50px}
  h1{font-size:30px}.hero h1{font-size:32px}.hero{padding:22px}
  .two{grid-template-columns:1fr}
  .befast{grid-template-columns:repeat(3,1fr)}
  .brand span{display:none}
  .updlist .u{grid-template-columns:1fr;gap:4px}
}
</style>
</head>

<script>
function pm(t){return "https://pubmed.ncbi.nlm.nih.gov/?term="+encodeURIComponent(t);}
function mp(s){return "https://medlineplus.gov/"+s+".html";}
function mps(q){return "https://vsearch.nlm.nih.gov/vivisimo/cgi-bin/query-meta?v%3Aproject=medlineplus&v%3Asources=medlineplus-bundle&query="+encodeURIComponent(q);}
const AREAS=[];

AREAS.push(
{
id:"stroke", name:"Cerebrovascular Disease", short:"Stroke", color:"#d9480f",
blurb:"Stroke and other disorders of the brain's blood supply. Time-critical: every minute of untreated large-vessel stroke costs roughly 1.9 million neurons.",
subs:[
{id:"ischemic", name:"Ischemic stroke & TIA", diseases:[
{id:"acute-ischemic-stroke", name:"Acute Ischemic Stroke", aka:"Brain attack, cerebral infarction",
ov:"Sudden loss of blood flow to part of the brain, usually from a clot (atherosclerosis, cardiac embolism from atrial fibrillation, or small-vessel disease). About 85% of strokes are ischemic. Treatment is extremely time-dependent.",
sx:["Sudden weakness or numbness of face, arm or leg, usually one side","Sudden trouble speaking or understanding (aphasia), slurred speech","Sudden vision loss in one or both eyes, or double vision","Sudden loss of balance, coordination or dizziness with other deficits","Facial droop; neglect of one side of space"],
early:["BE FAST: Balance, Eyes, Face drooping, Arm weakness, Speech difficulty, Time to call 911","Prior TIA (symptoms that resolved) is a major warning — up to ~10% have a stroke within days","Note the 'last known well' time; it determines treatment eligibility"],
red:["Any sudden focal deficit — call emergency services immediately; do not drive yourself","Decreased consciousness, severe headache with deficit (possible hemorrhage)"],
dx:["Non-contrast CT (excludes hemorrhage) ± CT angiography/perfusion to find large-vessel occlusion","MRI diffusion-weighted imaging is most sensitive","NIH Stroke Scale (NIHSS) to grade severity","Glucose check (hypoglycemia mimics stroke), ECG/telemetry for atrial fibrillation, echocardiogram, lipids, HbA1c"],
tx:[["Acute reperfusion",["IV thrombolysis: tenecteplase (single bolus) or alteplase within 4.5 h of last known well for disabling deficits — the 2026 AHA/ASA guideline makes tenecteplase an equal first-line option","Selected patients up to 9 h (or wake-up stroke) using advanced MRI/perfusion imaging","Endovascular thrombectomy for large-vessel occlusion up to 24 h in selected patients, now including many with large infarct cores","Direct transport to a thrombectomy-capable center where systems allow; mobile stroke units speed treatment"]],
["Early medical management",["BP below 185/110 before and below 180/105 for 24 h after thrombolysis; avoid intensive lowering (<140) after lysis or successful thrombectomy","Dual antiplatelet therapy (aspirin + clopidogrel ~21 days, or aspirin + ticagrelor) for minor non-cardioembolic stroke not receiving lysis","Swallow screen before oral intake, DVT prophylaxis, treat fever and hyperglycemia, stroke-unit care"]],
["Secondary prevention",["High-intensity statin (LDL target <70 mg/dL)","Anticoagulation (usually a DOAC) for atrial fibrillation","Carotid endarterectomy or stenting for symptomatic 70–99% stenosis","BP control, diabetes control, smoking cessation, exercise, Mediterranean-style diet; PFO closure in selected younger patients"]],
["Recovery",["Early, intensive multidisciplinary rehabilitation (PT, OT, speech)","Screen for depression, spasticity (botulinum toxin), falls"]]],
upd:["Jan 2026: AHA/ASA published a new Acute Ischemic Stroke guideline replacing the 2018/2019 versions — tenecteplase equal to alteplase, expanded thrombectomy eligibility, mobile stroke units, and the first detailed pediatric stroke recommendations."],
tags:["weakness","numbness","speech","vision","dizziness","facial droop","emergency"],
refs:[["Prabhakaran S, et al. 2026 Guideline for the Early Management of Patients With Acute Ischemic Stroke. Stroke. 2026 (AHA/ASA)","https://pubmed.ncbi.nlm.nih.gov/41582814/"],["AHA: Top Things to Know — 2026 AIS Guideline","https://professional.heart.org/en/science-news/2026-guideline-for-the-early-management-of-patients-with-acute-ischemic-stroke/top-things-to-know"],["Kleindorfer DO, et al. 2021 Guideline for the Prevention of Stroke in Patients With Stroke and TIA. Stroke. 2021",pm("2021 Guideline for the Prevention of Stroke in Patients With Stroke and Transient Ischemic Attack")],["MedlinePlus (NIH/NLM): Stroke",mp("stroke")]]},

{id:"tia", name:"Transient Ischemic Attack (TIA)", aka:"Mini-stroke",
ov:"Temporary neurological symptoms from brief ischemia without permanent infarction on imaging. A TIA is a medical emergency because stroke risk is highest in the first 48 hours.",
sx:["Same symptoms as stroke (weakness, numbness, speech or vision loss) that resolve, usually within minutes to an hour","Amaurosis fugax: transient monocular blindness like a curtain coming down"],
early:["Any transient focal symptom, even if fully resolved","Recurrent stereotyped episodes may signal a tight artery or 'capsular warning syndrome'"],
red:["Do not wait to see if symptoms return — seek same-day emergency evaluation"],
dx:["Urgent MRI (DWI) — a lesion reclassifies the event as stroke","Vessel imaging of head and neck (CTA/MRA/carotid ultrasound)","ECG and prolonged rhythm monitoring for atrial fibrillation","ABCD2 score estimates short-term risk but should not delay workup"],
tx:[["Immediate",["Short-term dual antiplatelet therapy (aspirin + clopidogrel for 21 days) for high-risk TIA (ABCD2 ≥4) without a cardioembolic source","Anticoagulation if atrial fibrillation is found"]],["Prevention",["High-intensity statin, BP control, carotid revascularization when indicated, lifestyle measures — same as ischemic stroke"]]],
tags:["weakness","numbness","speech","vision","emergency"],
refs:[["Johnston SC, et al. Clopidogrel and Aspirin in Acute Ischemic Stroke and High-Risk TIA (POINT). N Engl J Med. 2018",pm("Clopidogrel and Aspirin in Acute Ischemic Stroke and High-Risk TIA")],["Kleindorfer DO, et al. 2021 AHA/ASA secondary prevention guideline",pm("2021 Guideline for the Prevention of Stroke in Patients With Stroke and Transient Ischemic Attack")],["MedlinePlus: Transient Ischemic Attack",mps("transient ischemic attack")]]}
]},
{id:"hemorrhagic", name:"Hemorrhagic stroke", diseases:[
{id:"ich", name:"Intracerebral Hemorrhage (ICH)", aka:"Hemorrhagic stroke, brain bleed",
ov:"Bleeding directly into brain tissue, most often from chronic hypertension (deep bleeds) or cerebral amyloid angiopathy (lobar bleeds in older adults). Accounts for ~10–15% of strokes with high mortality.",
sx:["Sudden focal deficit, often with headache, vomiting and declining alertness","Seizures (especially lobar bleeds)","Symptoms may worsen over the first hours as the hematoma expands"],
early:["Severe headache with neurological deficit","Uncontrolled high blood pressure or anticoagulant use increases risk"],
red:["Decreasing consciousness, vomiting, unequal pupils — neurosurgical emergency"],
dx:["Non-contrast CT immediately","CTA 'spot sign' predicts expansion; MRI/angiography to look for vascular malformation, tumor or amyloid angiopathy"],
tx:[["Acute",["Rapid, smooth BP lowering — target systolic ~140 mmHg (avoid <130) for mild–moderate ICH","Reverse anticoagulation promptly: 4-factor PCC + IV vitamin K (warfarin); idarucizumab (dabigatran); andexanet alfa or 4F-PCC (factor Xa inhibitors)","ICU or stroke-unit care, seizure treatment if seizures occur (no routine prophylaxis)","Surgery: cerebellar hemorrhage with compression/hydrocephalus; minimally invasive evacuation may benefit selected lobar bleeds (ENRICH trial); external ventricular drain for hydrocephalus"]],["Prevention",["Long-term BP control (<130/80)","Weigh restarting antithrombotics individually; left atrial appendage occlusion for some AF patients"]]],
tags:["headache","weakness","vomiting","emergency"],
refs:[["Greenberg SM, et al. 2022 Guideline for the Management of Patients With Spontaneous ICH. Stroke. 2022",pm("2022 Guideline for the Management of Patients With Spontaneous Intracerebral Hemorrhage")],["Pradilla G, et al. Trial of Minimally Invasive Intracerebral Hemorrhage Evacuation (ENRICH). N Engl J Med. 2024",pm("Trial of Minimally Invasive Intracerebral Hemorrhage Evacuation")]]},
{id:"sah", name:"Subarachnoid Hemorrhage (SAH)", aka:"Ruptured brain aneurysm",
ov:"Bleeding into the space around the brain, most often from a ruptured saccular aneurysm. Peak age 40–60; risk factors include smoking, hypertension, family history and polycystic kidney disease.",

early:["Sentinel headache (a sudden severe headache days–weeks before rupture)","Third-nerve palsy with dilated pupil (expanding posterior communicating aneurysm)"],
red:["Any thunderclap headache needs emergency imaging"],
dx:["Non-contrast CT (very sensitive within 6 h)","Lumbar puncture for xanthochromia if CT negative and suspicion remains","CTA or catheter angiography to locate the aneurysm"],
tx:[["Acute",["Secure the aneurysm early by endovascular coiling or surgical clipping","Oral nimodipine for 21 days to improve outcome (delayed cerebral ischemia)","Maintain euvolemia; treat hydrocephalus with EVD; neuro-ICU monitoring for vasospasm (days 3–14)"]],["Long term",["Smoking cessation, BP control; screening of first-degree relatives in familial cases"]]],
tags:["headache","neck stiffness","vomiting","emergency"],
refs:[["Hoh BL, et al. 2023 Guideline for the Management of Patients With Aneurysmal SAH. Stroke. 2023",pm("2023 Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage")],["MedlinePlus: Subarachnoid hemorrhage",mps("subarachnoid hemorrhage")]]}
]},

{

dx:["Cognitive testing (MoCA, MMSE) and history from an informant","Exclude reversible causes: B12, thyroid, depression, medications, sleep apnea","MRI (atrophy pattern, vascular disease)","Biomarkers: amyloid PET, CSF Aβ42/40 and p-tau, or FDA-cleared blood tests (plasma p-tau217/Aβ42 ratio, cleared May 2025)","APOE ε4 genotyping before anti-amyloid therapy (ARIA risk)"],
tx:[["Disease-modifying (early AD: MCI or mild dementia with confirmed amyloid)",["Lecanemab (Leqembi): IV every 2 weeks; subcutaneous autoinjector (Leqembi Iqlik) approved for maintenance and, since July 2026, for initiation at home","Donanemab (Kisunla): IV monthly; can be stopped once amyloid is cleared","Require baseline and periodic MRIs to monitor ARIA (brain swelling/microbleeds); higher risk in APOE ε4 homozygotes and with anticoagulants","Modest effect: slows decline by ~25–35% over 18 months; not a cure"]],
["Symptomatic",["Cholinesterase inhibitors: donepezil, rivastigmine, galantamine (mild–severe)","Memantine (moderate–severe), alone or combined","Brexpiprazole approved for agitation associated with AD dementia; suvorexant studied for insomnia in AD"]],
["Non-drug",["Exercise, social and cognitive engagement, hearing-aid use, vascular risk control","Caregiver support, safety planning, advance directives, driving evaluation"]]],

tags:["memory loss","confusion","behavior change"],
refs:[["Alzheimer's Association: Lecanemab (Leqembi)","https://www.alz.org/alzheimers-dementia/treatments/lecanemab-leqembi"],["Alzheimer's Association: FDA approval of Leqembi subcutaneous starter dose (July 2026)","https://www.alz.org/news/2026/alzheimers-association-welcomes-fda-approval-leqembi-subcutaneous-starter-dose"],["FDA: FDA Clears First Blood Test Used in Diagnosing Alzheimer's Disease (2025)","https://www.fda.gov/news-events/press-announcements/fda-clears-first-blood-test-used-diagnosing-alzheimers-disease"],["Jack CR Jr, et al. Revised criteria for diagnosis and staging of Alzheimer's disease: Alzheimer's Association Workgroup. Alzheimers Dement. 2024",pm("Revised criteria for diagnosis and staging of Alzheimer's disease: Alzheimer's Association Workgroup")],["Cummings J, et al. Lecanemab: Appropriate Use Recommendations. J Prev Alzheimers Dis. 2023",pm("Lecanemab: Appropriate Use Recommendations")],["MedlinePlus: Alzheimer's Disease",mp("alzheimersdisease")]]},

{id:"dlb", name:"Dementia with Lewy Bodies (DLB)", aka:"Lewy body dementia",
ov:"Second most common neurodegenerative dementia, caused by α-synuclein (Lewy body) pathology. Closely related to Parkinson's disease dementia.",
sx:["Fluctuating attention and alertness","Recurrent, well-formed visual hallucinations (people, animals)","Parkinsonism (slowness, stiffness, shuffling)","REM sleep behavior disorder; autonomic problems (orthostatic hypotension, constipation)"],

red:["Severe reactions to antipsychotics (neuroleptic sensitivity) can be life-threatening"],

tx:[["Medications",["Cholinesterase inhibitors (rivastigmine, donepezil) — often more effective than in AD for cognition and hallucinations","Levodopa for parkinsonism at the lowest effective dose","For psychosis: avoid typical antipsychotics; low-dose quetiapine, clozapine or pimavanserin (off-label in DLB) used cautiously","Midodrine/droxidopa for orthostatic hypotension; melatonin or clonazepam for RBD"]],["Supportive",["Fall prevention, PT, caregiver education"]]],

{id:"ftd", name:"Frontotemporal Dementia (FTD)", aka:"Frontotemporal lobar degeneration, Pick's disease",

sx:["Disinhibition, socially inappropriate behavior, impulsivity","Apathy, loss of empathy, compulsive or ritualistic behaviors","Dietary changes, binge eating, sweet cravings","Progressive language loss (word meaning or grammar/speech production)"],
early:["Personality change in midlife noticed by family","Difficulty finding or understanding words while memory is relatively spared"],
red:["Associated weakness/fasciculations suggests FTD-ALS overlap"],
dx:["Clinical criteria (Rascovsky for bvFTD; Gorno-Tempini for PPA)","MRI/FDG-PET frontal/temporal atrophy or hypometabolism","Genetic testing and counseling"],
tx:[["Symptomatic",["SSRIs or trazodone for disinhibition, compulsions and agitation","Cholinesterase inhibitors are not effective and may worsen behavior","Speech therapy for PPA"]],["Supportive",["Caregiver support, safety, financial and legal planning; clinical trials (e.g., GRN-targeted therapies)"]]],
tags:["behavior change","speech","memory loss"],
refs:[["Rascovsky K, et al. Sensitivity of revised diagnostic criteria for the behavioural variant of FTD. Brain. 2011",pm("Sensitivity of revised diagnostic criteria for the behavioural variant of frontotemporal dementia")],["Gorno-Tempini ML, et al. Classification of primary progressive aphasia and its variants. Neurology. 2011",pm("Classification of primary progressive aphasia and its variants")]]}
]},

{id:"nph", name:"Normal Pressure Hydrocephalus (NPH)", aka:"Idiopathic NPH",

],

{
id:"epilepsy", name:"Epilepsy & Seizures", short:"Epilepsy", color:"#e8590c",

{id:"noh", name:"Neurogenic Orthostatic Hypotension (nOH)", aka:"nOH, autonomic failure",
ov:"A sustained fall in blood pressure on standing caused by failure of the sympathetic nerves to release norepinephrine. It is a hallmark of Parkinson's disease, multiple system atrophy, Lewy body dementia, pure autonomic failure and diabetic or amyloid autonomic neuropathy. It causes falls and is often accompanied by high blood pressure when lying down (supine hypertension).",
sx:["Lightheadedness, dimming or blurred vision, weakness when standing","'Coat-hanger' neck and shoulder pain; fatigue, cognitive slowing","Fainting and falls — typically worse in the morning, after meals, in heat, or after exertion","Supine hypertension at night (headache, nocturia)"],
early:["Unexplained falls or near-fainting in an older adult, especially with Parkinson's disease, diabetes or bladder/bowel problems","Low blood pressure readings while standing that look normal sitting"],
red:["Syncope with injury; very high supine blood pressure"],
dx:["Blood pressure and heart rate lying and after 3 minutes standing: systolic drop ≥20 mmHg (or diastolic ≥10)","Neurogenic pattern: little heart-rate rise (ΔHR/ΔSBP <0.5 bpm/mmHg)","Autonomic testing (Valsalva, tilt), plasma norepinephrine, 24-hour BP monitoring; look for the underlying cause"],
tx:[["Non-drug",["Stop or reduce offending drugs (diuretics, alpha-blockers, nitrates, some antidepressants, excess dopaminergic drugs)","Fluids and salt, abdominal binder or compression, small low-carbohydrate meals, water bolus (500 mL) before standing","Stand up slowly, counter-maneuvers (leg crossing, squatting), sleep with head of bed raised 15–20 cm to limit supine hypertension"]],["Medications",["Midodrine (alpha-agonist; take while upright, not within 4 h of bedtime)","Droxidopa (FDA-approved for symptomatic nOH due to PD, MSA, PAF, dopamine β-hydroxylase deficiency)","Fludrocortisone (watch potassium, edema, supine hypertension)","Pyridostigmine (mild cases); atomoxetine off-label, especially in MSA","Bedtime short-acting antihypertensive for supine hypertension if severe"]]],
upd:["Mar 2026: The phase 3 CYPRESS trial of ampreloxetine for nOH in multiple system atrophy did not meet its primary endpoint, and the program was discontinued."],
tags:["dizziness","fainting","falls","fatigue","neck pain"],
refs:[["Gibbons CH, et al. Consensus panel recommendations for the screening, diagnosis and treatment of nOH and associated supine hypertension. J Neurol. 2017",pm("The recommendations of a consensus panel for the screening, diagnosis, and treatment of neurogenic orthostatic hypotension and associated supine hypertension")],["Theravance Biopharma: Phase 3 CYPRESS study did not meet primary endpoint (Mar 2026)","https://investor.theravance.com/node/15756"],["MedlinePlus: Orthostatic hypotension",mps("orthostatic hypotension")]]},

{id:"reflex-syncope", name:"Reflex (Vasovagal) Syncope", aka:"Fainting, neurally mediated syncope, situational syncope",
ov:"The most common cause of fainting at every age: a temporary reflex that slows the heart and dilates blood vessels, briefly reducing blood flow to the brain. Benign, but must be distinguished from cardiac syncope.",
sx:["Brief loss of consciousness (usually <1 minute) with rapid, complete recovery","Prodrome: warmth, sweating, nausea, pallor, tunnel vision, muffled hearing","A few brief jerks can occur and are often mistaken for a seizure","Fatigue after the event"],
early:["Triggers: prolonged standing, heat, pain, sight of blood or needles, emotional stress, coughing, urination or swallowing (situational)"],
red:["Fainting during exertion or while lying down, palpitations before fainting, no warning, injury, known heart disease, abnormal ECG, or family history of sudden death — urgent cardiac evaluation"],
dx:["Detailed history from patient and witness; 12-lead ECG in everyone; orthostatic BP","Tilt-table test in uncertain or recurrent cases; echocardiogram or rhythm monitoring if cardiac cause suspected"],
tx:[["Treatment",["Education and reassurance; recognize the prodrome and lie down or sit immediately","Physical counter-pressure maneuvers (leg crossing with muscle tensing, hand gripping)","Increased fluid and salt intake; avoid triggers and dehydration; review BP-lowering drugs","Recurrent episodes: midodrine or fludrocortisone; tilt training","Cardiac pacing only for selected older patients with documented asystole (cardioinhibitory syncope)"]]],
tags:["fainting","dizziness","nausea"],
refs:[["Shen WK, et al. 2017 ACC/AHA/HRS Guideline for the Evaluation and Management of Patients With Syncope. Circulation. 2017",pm("2017 ACC/AHA/HRS Guideline for the Evaluation and Management of Patients With Syncope")],["Brignole M, et al. 2018 ESC Guidelines for the diagnosis and management of syncope. Eur Heart J. 2018",pm("2018 ESC Guidelines for the diagnosis and management of syncope")],["MedlinePlus: Fainting",mps("fainting syncope")]]}
]},
{id:"autonomic-failure", name:"Autonomic failure & neuropathies", diseases:[
{id:"paf", name:"Pure Autonomic Failure (PAF)", aka:"Bradbury-Eggleston syndrome",
ov:"A rare, slowly progressive α-synuclein disease of the peripheral autonomic nerves causing isolated autonomic failure. Over years, about a third or more convert to Parkinson's disease, Lewy body dementia or multiple system atrophy.",
sx:["Orthostatic hypotension with lightheadedness, fainting and coat-hanger pain","Constipation, urinary urgency or retention, erectile dysfunction","Reduced sweating; heat intolerance"],
early:["Years of erectile or bladder dysfunction before orthostatic symptoms","REM sleep behavior disorder or loss of smell may hint at later conversion to PD/DLB/MSA"],
dx:["Autonomic testing showing widespread sympathetic and parasympathetic failure","Very low supine plasma norepinephrine (postganglionic damage)","Normal neurological exam; skin biopsy α-synuclein deposits"],
tx:[["Treatment",["Same as neurogenic orthostatic hypotension: non-drug measures, midodrine, droxidopa, fludrocortisone","Bladder and bowel management","Regular neurological follow-up to detect motor or cognitive conversion"]]],
tags:["dizziness","fainting","incontinence"],
refs:[["Kaufmann H, et al. Natural history of pure autonomic failure: a United States prospective cohort. Ann Neurol. 2017",pm("Natural history of pure autonomic failure: A United States prospective cohort")]]},
{id:"diabetic-autonomic-neuropathy", name:"Diabetic Autonomic Neuropathy", aka:"Cardiovascular autonomic neuropathy, gastroparesis",
ov:"Damage to autonomic nerves from long-standing diabetes, often alongside sensory neuropathy. Cardiovascular autonomic neuropathy is linked to silent heart attacks and higher mortality.",
sx:["Resting fast heart rate and exercise intolerance","Orthostatic hypotension","Gastroparesis: early fullness, nausea, vomiting, erratic blood sugars; diarrhea or constipation","Bladder dysfunction, erectile dysfunction","Dry, cracked feet (loss of sweating); hypoglycemia unawareness"],
early:["Unexplained resting heart rate >100 bpm","Erratic glucose levels after meals, early satiety"],
dx:["Cardiovascular reflex tests (heart-rate variability with deep breathing, Valsalva, standing)","Gastric emptying scintigraphy; bladder ultrasound for post-void residual"],
tx:[["Treatment",["Optimize glucose, blood pressure and lipid control","Orthostatic hypotension: as for nOH","Gastroparesis: small low-fat, low-fiber meals; metoclopramide (short-term, tardive dyskinesia risk), erythromycin; gastric electrical stimulation in refractory cases","PDE5 inhibitors for erectile dysfunction; timed voiding/catheterization for bladder","Foot care; adjust insulin for hypoglycemia unawareness"]]],
tags:["dizziness","nausea","palpitations","incontinence"],
refs:[["Pop-Busui R, et al. Diabetic Neuropathy: A Position Statement by the ADA. Diabetes Care. 2017",pm("Diabetic Neuropathy: A Position Statement by the American Diabetes Association")],["Camilleri M, et al. ACG Clinical Guideline: Gastroparesis. Am J Gastroenterol. 2022",pm("ACG Clinical Guideline: Gastroparesis")]]},
{id:"hattr-polyneuropathy", name:"Hereditary Transthyretin Amyloidosis with Polyneuropathy (hATTR-PN)", aka:"Familial amyloid polyneuropathy",
ov:"Inherited (autosomal dominant) disease in which misfolded transthyretin (TTR) protein deposits in nerves, heart and other organs. Highly treatable today, so early diagnosis matters. The V122I variant is common in people of African descent; V30M in Portugal, Sweden and Japan.",
sx:["Length-dependent painful sensory neuropathy (burning feet), then weakness","Autonomic: orthostatic hypotension, alternating diarrhea/constipation, erectile dysfunction, unintended weight loss","Bilateral carpal tunnel syndrome, lumbar spinal stenosis, biceps tendon rupture","Heart failure or conduction disease (cardiomyopathy); vitreous opacities"],
early:["Bilateral carpal tunnel syndrome years before neuropathy","Progressive neuropathy with autonomic symptoms and family history of heart failure or neuropathy"],
dx:["TTR gene sequencing","Tissue biopsy (fat pad, nerve) with Congo red; cardiac MRI/technetium pyrophosphate scan","Exclude AL amyloidosis (serum/urine immunofixation, free light chains)"],
tx:[["Disease-modifying",["TTR silencers: patisiran (IV every 3 weeks), vutrisiran (SC every 3 months; also approved for ATTR cardiomyopathy in 2025), eplontersen (SC monthly)","TTR stabilizers (tafamidis, acoramidis approved for cardiomyopathy; diflunisal off-label)","Liver transplantation (historic, now rarely used)"]],["Supportive",["Treat neuropathic pain, orthostatic hypotension, GI symptoms; cardiac care; genetic counseling and testing for relatives"]]],
tags:["numbness","burning pain","dizziness","weight loss"],
refs:[["Adams D, et al. Patisiran, an RNAi therapeutic, for hereditary transthyretin amyloidosis (APOLLO). N Engl J Med. 2018",pm("Patisiran, an RNAi Therapeutic, for Hereditary Transthyretin Amyloidosis")],["Adams D, et al. Expert consensus recommendations to improve diagnosis of ATTR amyloidosis with polyneuropathy. J Neurol. 2021",pm("Expert consensus recommendations to improve diagnosis of ATTR amyloidosis with polyneuropathy")],["Coelho T, et al. Eplontersen for Hereditary Transthyretin Amyloidosis With Polyneuropathy (NEURO-TTRansform). JAMA. 2023",pm("Eplontersen for Hereditary Transthyretin Amyloidosis With Polyneuropathy")]]},
{id:"aag", name:"Autoimmune Autonomic Ganglionopathy (AAG)", aka:"Autoimmune autonomic neuropathy",
ov:"An immune-mediated disorder in which antibodies against the ganglionic acetylcholine receptor block transmission in autonomic ganglia, causing subacute widespread autonomic failure. Can follow infection or be paraneoplastic. Potentially reversible with immunotherapy.",
sx:["Severe orthostatic hypotension","GI dysmotility: severe constipation, early satiety, vomiting, ileus","Urinary retention, dry eyes and mouth, reduced sweating","Pupils that react poorly to light; blurred near vision"],
early:["Subacute onset over days to weeks of combined orthostatic, GI and dry-eye/mouth symptoms, often after an infection"],
dx:["Ganglionic AChR (α3) antibodies; autonomic testing","Cancer screening (paraneoplastic forms)"],
tx:[["Treatment",["Immunotherapy: IVIG, plasma exchange, corticosteroids; rituximab or mycophenolate for maintenance","Symptomatic treatment of orthostatic hypotension, GI and bladder dysfunction","Pyridostigmine may help some symptoms"]]],
tags:["dizziness","fainting","constipation","dry mouth"],
refs:[["Vernino S, et al. Autoantibodies to ganglionic acetylcholine receptors in autoimmune autonomic neuropathies. N Engl J Med. 2000",pm("Autoantibodies to ganglionic acetylcholine receptors in autoimmune autonomic neuropathies")]]}
]},

ov:"A potentially life-threatening surge in blood pressure in people with spinal cord injury at or above T6, triggered by a stimulus below the injury (most often a full bladder). The sympathetic response below the injury is unchecked by the brain.",
sx:["Sudden severe hypertension (20–40 mmHg above baseline, which may be low in SCI)","Pounding headache","Flushing and sweating above the injury; pale, cool skin below","Slow heart rate, nasal congestion, blurred vision, anxiety"],
early:["Any headache or flushing in a person with high spinal cord injury — check blood pressure"],
red:["Medical emergency — can cause stroke, seizures or death if untreated"],
dx:["Clinical; identify the trigger: bladder distension or blocked catheter, constipation, pressure sores, ingrown toenail, tight clothing, menstruation, labor, procedures"],
tx:[["Immediate management",["Sit the person upright and lower the legs; loosen clothing and straps","Check and empty the bladder (catheterize or unblock catheter), then check for fecal impaction with anesthetic gel","If systolic BP stays ≥150 mmHg: fast-acting antihypertensive (e.g., nitroglycerin paste, immediate-release nifedipine, captopril) with monitoring","Prevention: regular bladder/bowel programs, skin care, carry a wallet card"]]],

["Guillain-Barré syndrome","gbs","Acute autonomic instability","GBS has prominent limb weakness and areflexia"],
["Botulism","","Dry mouth, ileus, poor pupil response","Descending muscle weakness, ptosis, diplopia"]];
DD["autonomic-dysreflexia"]=[
["Hypertensive emergency from other causes","","Severe hypertension with headache","No spinal cord injury trigger; different risk factors"],
["Migraine","migraine","Pounding headache","Normal blood pressure; check BP in any SCI patient with headache"],
["Pheochromocytoma","","Episodic hypertension, sweating, headache","No relation to bladder/bowel triggers; high metanephrines"]];

</script>
<script>
/* ===== WEEKLY-UPDATES-START (edited by the Saturday update job; keep valid JavaScript) =====
   SITE_UPDATED: date of the most recent update run (YYYY-MM-DD).
   WATCH: pending decisions to watch, as [text, condition id or null]. The job may rewrite this list
          (drop items once decided, add new pending FDA dates); it is the only list that may be edited.
   WEEKLY: one object per change, appended over time; never delete or edit old entries.
   Fields: added (YYYY-MM-DD, date of the run that added it), id (condition id, or null for site-wide news),
   kind: "upd"  dated development for a condition: {date:"YYYY-MM-DD" (or "YYYY-MM"), text, ref}
                (shown in the condition's Recent updates and in What's new),
         "tx"   treatment bullet: {group: exact title of an existing treatment card, or a short new title, text, ref},
         "ddx"  look-alike row: {row:[name, linked condition id or "", what's similar, how to tell apart], ref optional},
         "ref"  reference only: {ref},
         "news" item with no condition page: {id:null, date, title, text, href}.
   ref is [title, url] of a page actually read. text is a plain sentence in your own words. */
const SITE_UPDATED = "2026-11-28";
const WATCH = [
["Huntington's disease — AMT-130 gene therapy: FDA target date May 1, 2027","huntingtons"],
["SCN2A/SCN8A developmental epileptic encephalopathies — relutrigine: FDA target date December 27, 2026",null]
];
const WEEKLY = [
{added:"2026-11-28", id:"dmd", kind:"upd", date:"2026-11-20", text:"FDA rejected Capricor's resubmitted application for deramiocel, an investigational donor heart-cell therapy for Duchenne muscular dystrophy, for the second time (the first was July 2025). FDA said the data did not show substantial evidence of effectiveness and raised data integrity concerns about the pivotal HOPE-3 study. Deramiocel remains unapproved.", ref:["BioPharma Dive: FDA again turns back Capricor Duchenne cell therapy (Nov 21, 2026)","https://www.biopharmadive.com/news/capricor-fda-duchenne-cell-therapy-deramiocel/875384/"]}
];
/* ===== WEEKLY-UPDATES-END ===== */
const D={}, ORDER=[];
AREAS.forEach(a=>a.subs.forEach(s=>s.diseases.forEach(d=>{d.area=a;d.sub=s;D[d.id]=d;ORDER.push(d);})));
const MON=["Jan","Feb","Mar","Apr","May","June","July","Aug","Sept","Oct","Nov","Dec"];
const fmtDate=s=>new Date(s+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"});
const AS_OF=new Date(SITE_UPDATED+"T12:00:00Z").toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric",timeZone:"UTC"});
/* Merge weekly updates and mark what is new (NEW badge for 7 days from the latest check) */
const dayNum=s=>Math.floor(Date.parse(s+"T12:00:00Z")/864e5);
const isNew=w=>!!w.added&&dayNum(w.added)>=dayNum(SITE_UPDATED)-6;
const NEW_TXT=new Set(), NEW_IDS=new Set();
WEEKLY.forEach(w=>{
  const d=w.id&&D[w.id]?D[w.id]:null, fresh=isNew(w);
  if(w.kind==="news"||w.kind==="upd"){UPDATES.push([w.date,w.title||(d?d.name:"Neurology news"),w.text,d?d.id:"",w.href||(w.ref?w.ref[1]:""),fresh]);}
  if(!d||w.kind==="news")return;
  if(w.kind==="upd"){const p=w.date.split("-"),u=MON[+p[1]-1]+" "+p[0]+": "+w.text;d.upd=(d.upd||[]).concat(u);if(fresh)NEW_TXT.add(u);}
  if(w.kind==="tx"){const t=w.group||"Recent additions",g=d.tx.find(x=>x[0]===t);g?g[1].push(w.text):d.tx.push([t,[w.text]]);if(fresh)NEW_TXT.add(w.text);}
  if(w.kind==="ddx"&&w.row){DD[d.id]=(DD[d.id]||[]).concat([w.row]);if(fresh)NEW_TXT.add(w.row[0]);}
  if(w.ref){d.refs.push(w.ref);if(fresh)NEW_TXT.add(w.ref[0]);}
  if(fresh)NEW_IDS.add(d.id);
});
UPDATES.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
const NEWB=`<span class="newb">NEW</span>`;
const FRESH=WEEKLY.filter(isNew);
function checkedLine(){return `<p class="checked">Checked for new approvals, guidelines and treatments: <b>${fmtDate(SITE_UPDATED)}</b>${FRESH.length?` · <a href="#updates">${FRESH.length} new item${FRESH.length===1?"":"s"} this week ${NEWB}</a>`:" · no changes found in the latest check"}</p>`;}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const view=$("#view");

/* ---------- Sidebar ---------- */
function buildSide(){
  let h='<h4>Areas of neurology</h4>';
  AREAS.forEach(a=>{
    h+=`<div class="tarea" data-a="${a.id}"><button data-toggle="${a.id}"><span class="dot" style="background:${a.color}"></span>${esc(a.short)}${a.subs.some(s=>s.diseases.some(d=>NEW_IDS.has(d.id)))?NEWB:""}<span class="chev">▶</span></button><div class="tsub"><a href="#a-${a.id}" style="font-weight:600">Overview</a>`;
    a.subs.forEach(s=>{h+=`<div class="sl">${esc(s.name)}</div>`;s.diseases.forEach(d=>{h+=`<a href="#d-${d.id}" data-d="${d.id}">${esc(d.name)}${NEW_IDS.has(d.id)?NEWB:""}</a>`;});});
    h+='</div></div>';
  });
  $("#side").innerHTML=h;
  $("#side").addEventListener("click",e=>{
    const t=e.target.closest("[data-toggle]");
    if(t){t.parentElement.classList.toggle("open");return;}
    if(e.target.closest("a"))document.body.classList.remove("nav");
  });
}
function markSide(areaId,dId){
  document.querySelectorAll(".tarea").forEach(el=>{
    const on=el.dataset.a===areaId; if(on)el.classList.add("open");
    el.querySelector("button").classList.toggle("on",on);
  });
  document.querySelectorAll(".tsub a[data-d]").forEach(a=>a.classList.toggle("on",a.dataset.d===dId));
  const cur=document.querySelector('.tsub a.on'); if(cur)cur.scrollIntoView({block:"nearest"});
}

/* ---------- Helpers ---------- */
const list=(arr)=>`<ul class="clean">${arr.map(x=>`<li>${esc(x)}${NEW_TXT.has(x)?NEWB:""}</li>`).join("")}</ul>`;
function dcard(d,extra=""){
  return `<a class="card dcard" href="#d-${d.id}" style="--c:${d.area.color}"><b>${esc(d.name)}${NEW_IDS.has(d.id)?NEWB:""}</b><p>${esc(d.ov)}</p>${d.upd?'<span class="badge">Updated 2025–26</span>':""}${extra}</a>`;
}
function setTitle(t){document.title=t?t+" — NeuroAtlas":"NeuroAtlas — An Interactive Guide to Neurology";}
function disclaimer(){return `<div class="disc"><b>Educational resource, not medical advice.</b> Content summarizes published guidelines and regulatory news as of ${AS_OF}. Treatments, doses and approvals change, and choices depend on the individual — always consult a qualified clinician. If you think someone is having a stroke, seizure lasting over 5 minutes, or other emergency, call 911 (or your local emergency number).</div>`;}
function befast(){
  const L=[["B","Balance","Sudden loss of balance"],["E","Eyes","Vision loss or double"],["F","Face","Drooping on one side"],["A","Arm","Weakness or numbness"],["S","Speech","Slurred or confused"],["T","Time","Call 911 now"]];
  return `<div class="emerg"><h3>⚠ Recognize a stroke — BE FAST</h3><div class="befast">${L.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span><small>${x[2]}</small></div>`).join("")}</div><p class="note" style="margin:10px 0 0">Also seek emergency care for: thunderclap ("worst ever") headache, a seizure longer than 5 minutes, fever with stiff neck and confusion, sudden weakness spreading up the legs with breathing trouble.</p></div>`;
}

/* ---------- Views ---------- */
function home(){
  setTitle(""); markSide(null,null);
  const nUpd=ORDER.filter(d=>d.upd).length;
  let h=`<section class="hero"><h1>Neurology, area by area</h1><p class="lede">Explore the major fields of neurology, drill into sub-areas and individual conditions, and see each disease's symptoms, early warning signs, diagnosis and current treatments — with references to guidelines and primary sources.</p>
  <div class="stats"><div class="stat"><b>${AREAS.length}</b><span>major areas</span></div><div class="stat"><b>${AREAS.reduce((n,a)=>n+a.subs.length,0)}</b><span>sub-areas</span></div><div class="stat"><b>${ORDER.length}</b><span>conditions</span></div><div class="stat"><b>${nUpd}</b><span>with 2025–26 updates</span></div></div></section>`+checkedLine();
  h+=befast();
  h+=`<div class="subhead"><h2>Major areas</h2><span>Select an area to drill down</span></div><div class="grid">`;
  AREAS.forEach(a=>{const n=a.subs.reduce((k,s)=>k+s.diseases.length,0);h+=`<a class="card acard" href="#a-${a.id}" style="--c:${a.color}"><b>${esc(a.name)}</b><p>${esc(a.blurb)}</p><span class="n">${a.subs.length} sub-areas · ${n} conditions →</span></a>`;});
  h+=`</div><div class="subhead"><h2>What's new</h2><span>Recent guideline changes and FDA actions</span></div><div class="card updlist">${UPDATES.slice(0,4).map(updRow).join("")}<p style="margin:10px 0 0"><a href="#updates" style="color:var(--accent);font-weight:600;text-decoration:none">See all updates →</a></p></div>`;
  h+=disclaimer(); view.innerHTML=h;
}
function updRow(u){const d=D[u[3]],ds=String(u[0]),p=ds.split("-");const t=p.length>2?fmtDate(ds):MON[+p[1]-1]+" "+p[0];return `<div class="u"><time>${t}</time><div><b>${esc(u[1])}${u[5]?NEWB:""}</b>${esc(u[2])}${d?` <a href="#d-${d.id}">Open ${esc(d.name)} →</a>`:u[4]?` <a href="${esc(u[4])}" target="_blank" rel="noopener">Source ↗</a>`:""}</div></div>`;}

function area(a){
  setTitle(a.name); markSide(a.id,null);
  let h=`<div class="crumbs"><a href="#home">Home</a>›<span>${esc(a.name)}</span></div><h1 style="border-left:6px solid ${a.color};padding-left:14px">${esc(a.name)}</h1><p class="lede">${esc(a.blurb)}</p>`;
  h+=`<div class="toc">${a.subs.map(s=>`<a href="#a-${a.id}" data-jump="s-${s.id}">${esc(s.name)}</a>`).join("")}</div>`;
  a.subs.forEach(s=>{h+=`<div class="subhead sec" id="s-${s.id}"><h2>${esc(s.name)}</h2><span>${s.diseases.length} condition${s.diseases.length>1?"s":""}</span></div><div class="grid">${s.diseases.map(d=>dcard(d)).join("")}</div>`;});
  h+=disclaimer(); view.innerHTML=h;
}

function disease(d){
  const a=d.area; setTitle(d.name); markSide(a.id,d.id);
  const i=ORDER.indexOf(d), prev=ORDER[i-1], next=ORDER[i+1];
  const secs=[["ov","Overview"],["sx","Symptoms"],["early","Early signs"]];
  if(d.red)secs.push(["red","Red flags"]);
  secs.push(["dx","Diagnosis"]); if(DD[d.id])secs.push(["dd","Differential diagnosis"]); secs.push(["tx","Treatment"]); if(d.upd)secs.push(["upd","Recent updates"]); secs.push(["refs","References"]);
  let h=`<div class="crumbs"><a href="#home">Home</a>›<a href="#a-${a.id}">${esc(a.name)}</a>›<span>${esc(d.sub.name)}</span></div>`;
  h+=`<div style="--c:${a.color}"><h1>${esc(d.name)}${NEW_IDS.has(d.id)?`<span class="newb big">Updated ${fmtDate(SITE_UPDATED)}</span>`:""}</h1>${d.aka?`<p class="aka">Also called: ${esc(d.aka)}</p>`:""}`;
  h+=`<div class="toc">${secs.map(s=>`<a href="#d-${d.id}" data-jump="x-${s[0]}">${s[1]}</a>`).join("")}</div>`;
  h+=`<p class="lede sec" id="x-ov" style="color:var(--ink);margin-top:16px">${esc(d.ov)}</p>`;
  h+=`<div class="two"><div class="card sec" id="x-sx"><h3>Symptoms</h3>${list(d.sx)}</div><div class="card k-early sec" id="x-early"><h3>Early signs &amp; warning clues</h3>${list(d.early)}</div></div>`;
  if(d.red)h+=`<div class="card k-red sec" id="x-red" style="margin-top:14px"><h3>⚠ Red flags — seek urgent care</h3>${list(d.red)}</div>`;
  h+=`<h2 class="sec" id="x-dx">Diagnosis</h2><div class="card">${list(d.dx)}</div>`;
  if(DD[d.id])h+=`<h2 class="sec" id="x-dd">Differential diagnosis: look-alikes</h2><p class="note" style="margin:-4px 0 10px">Conditions that can be confused with ${esc(d.name)}, what they share, and the clues that tell them apart.</p><div class="card ddt"><div class="ddrow head"><div>Look-alike</div><div>What's similar</div><div>How to tell them apart</div></div>${DD[d.id].map(r=>`<div class="ddrow"><div class="nm">${r[1]&&D[r[1]]?`<a href="#d-${r[1]}">${esc(r[0])} →</a>`:esc(r[0])}${NEW_TXT.has(r[0])?NEWB:""}</div><div class="sim"><span class="lab">Similar</span>${esc(r[2])}</div><div><span class="lab">Key differences</span>${esc(r[3])}</div></div>`).join("")}</div>`;
  h+=`<h2 class="sec" id="x-tx">Treatment &amp; medications</h2><div class="card tx">${d.tx.map(g=>`<div class="txg"><h3>${esc(g[0])}</h3>${list(g[1])}</div>`).join("")}<p class="note" style="margin:6px 0 0">Medication choice, dosing and monitoring must be individualized by a clinician; brand names are given for recognition only.</p></div>`;
  if(d.upd)h+=`<h2 class="sec" id="x-upd">Recent updates</h2><div class="card k-upd"><h3>2025–2026 developments</h3>${list(d.upd)}</div>`;
  h+=`<h2 class="sec" id="x-refs">References</h2><div class="card"><ol class="refs">${d.refs.map(r=>`<li><a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])}</a> <span class="ext">↗</span>${NEW_TXT.has(r[0])?NEWB:""}</li>`).join("")}</ol><p class="note" style="margin:10px 0 0">Journal citations link to PubMed (NIH). Statements on 2025–26 approvals link to FDA or news reports.</p></div>`;
  const sib=d.sub.diseases.filter(x=>x!==d);
  if(sib.length)h+=`<h2>Related in ${esc(d.sub.name)}</h2><div class="grid">${sib.map(x=>dcard(x)).join("")}</div>`;
  h+=`<div class="pager">${prev?`<a class="card" href="#d-${prev.id}"><small>← Previous</small><b>${esc(prev.name)}</b></a>`:"<span></span>"}${next?`<a class="card" href="#d-${next.id}" style="text-align:right"><small>Next →</small><b>${esc(next.name)}</b></a>`:"<span></span>"}</div></div>`;
  h+=disclaimer(); view.innerHTML=h;
}

/* Symptom finder */
const SYM_SEL=new Set();
function symptoms(){
  setTitle("Symptom finder"); markSide(null,null);
  const counts={}; ORDER.forEach(d=>(d.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
  const tags=Object.keys(counts).sort((x,y)=>counts[y]-counts[x]||x.localeCompare(y));
  let h=`<div class="crumbs"><a href="#home">Home</a>›<span>Symptom finder</span></div><h1>Symptom finder</h1><p class="lede">Pick one or more symptoms to see which neurological conditions commonly include them. This is a learning tool — it cannot diagnose you.</p>`;
  h+=`<div class="card"><div class="chips" id="symchips">${tags.map(t=>`<button class="chip${SYM_SEL.has(t)?" on":""}" data-t="${esc(t)}">${esc(t)} <span style="opacity:.6">${counts[t]}</span></button>`).join("")}</div><p class="note" style="margin:12px 0 0"><button class="chip" id="symclear">Clear selection</button></p></div><div id="symres"></div>`;
  h+=disclaimer(); view.innerHTML=h; drawSym();
  $("#symchips").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;const t=b.dataset.t;SYM_SEL.has(t)?SYM_SEL.delete(t):SYM_SEL.add(t);b.classList.toggle("on");drawSym();});
  $("#symclear").onclick=()=>{SYM_SEL.clear();document.querySelectorAll("#symchips .chip").forEach(c=>c.classList.remove("on"));drawSym();};
}
function drawSym(){
  const el=$("#symres"); if(!el)return;
  if(!SYM_SEL.size){el.innerHTML=`<p class="note" style="margin-top:18px">No symptoms selected yet.</p>`;return;}
  const sel=[...SYM_SEL];
  const hits=ORDER.map(d=>({d,n:sel.filter(t=>(d.tags||[]).includes(t)).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n||a.d.name.localeCompare(b.d.name));
  const em=sel.includes("emergency")||hits.slice(0,5).some(x=>(x.d.tags||[]).includes("emergency"));
  el.innerHTML=(em?befast():"")+`<div class="subhead"><h2>${hits.length} matching condition${hits.length===1?"":"s"}</h2><span>sorted by number of matching symptoms</span></div><div class="grid">${hits.map(x=>dcard(x.d,`<div class="match" style="margin-top:6px">${x.n} of ${sel.length} selected · ${esc(x.d.area.short)}</div>`)).join("")}</div>`;
}

function updates(){
  setTitle("What's new"); markSide(null,null);
  const label={upd:"Update",tx:"Treatment",ddx:"Look-alike",ref:"Reference",news:"News"};
  const fresh=`<div class="card k-upd" style="margin:6px 0 10px"><h3>Latest weekly check: ${fmtDate(SITE_UPDATED)}</h3>${FRESH.length?`<ul class="clean">${FRESH.map(w=>{const d=w.id&&D[w.id];return `<li><b>${label[w.kind]||"Update"}</b>${d?` · <a href="#d-${d.id}" style="color:var(--accent);text-decoration:none">${esc(d.name)}</a>`:""}: ${esc(w.kind==="ddx"?w.row[0]+" added as a look-alike":w.text||(w.ref?w.ref[0]:""))} ${NEWB}</li>`;}).join("")}</ul>`:`<p style="margin:0;color:var(--muted)">No new approvals, guideline changes, or treatments were found since the previous check.</p>`}</div>`;
  view.innerHTML=`<div class="crumbs"><a href="#home">Home</a>›<span>What's new</span></div><h1>What's new in neurology</h1><p class="lede">Guideline changes, FDA actions and new treatment evidence reflected on this site, newest first. The site is checked every week.</p>${fresh}<div class="card updlist">${UPDATES.map(updRow).join("")}</div>
  <h2>Pending decisions to watch</h2><div class="card">${WATCH.length?`<ul class="clean">${WATCH.map(([t,id])=>`<li>${esc(t)}${id&&D[id]?` <a href="#d-${id}" style="color:var(--accent);text-decoration:none">Open →</a>`:""}</li>`).join("")}</ul>`:`<p style="margin:0;color:var(--muted)">None at the moment.</p>`}</div>`+disclaimer();
}

function about(){
  setTitle("About & sources"); markSide(null,null);
  view.innerHTML=`<div class="crumbs"><a href="#home">Home</a>›<span>About &amp; sources</span></div><h1>About &amp; sources</h1><p class="lede">NeuroAtlas is an educational overview of clinical neurology for curious readers, patients, families and students.</p>
  <div class="card"><h3>How the content was built</h3>${list([
  "Each condition summarizes current society guidelines (AAN, AHA/ASA, AHS, AASM, EAN/PNS, IDSA, AES and others), landmark trials and authoritative patient resources (NIH MedlinePlus, NINDS).",
  "The site is checked every week for new FDA actions, guideline changes and treatment evidence (latest check: "+AS_OF+"); each change is dated in the 'Recent updates' sections, and items added in the latest check carry a NEW badge.",
  "Each condition page has a differential-diagnosis table comparing it with its common look-alikes, with links when the look-alike has its own page.",
  "Every condition page lists its references. Guideline and trial citations open a PubMed search for the exact title, which keeps the link working even if a publisher's URL changes.",
  "Symptoms and treatments are deliberately summarized; they are not complete prescribing information or a substitute for a clinical evaluation."])}</div>
  <h2>General references</h2><div class="card"><ol class="refs">${GENERAL_REFS.map(r=>`<li><a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])}</a> <span class="ext">↗</span></li>`).join("")}</ol></div>
  <h2>Using this site</h2><div class="card">${list(["Browse areas in the left panel (tap ☰ on phones) and expand an area to see its sub-areas and conditions.","Press / to jump to search; search covers names, symptoms, early signs, tests and drug names.","Use the Symptom finder to see conditions sharing a set of symptoms."])}</div>`+disclaimer();
}

/* ---------- Search ---------- */
const IDX=ORDER.map(d=>({d,name:(d.name+" "+(d.aka||"")).toLowerCase(),body:[d.ov,...d.sx,...d.early,...(d.red||[]),...d.dx,...d.tx.flatMap(g=>[g[0],...g[1]]),...(d.upd||[]),...(d.tags||[]),...(DD[d.id]||[]).map(r=>r[0])].join(" • ")}));
let sel=-1;
function doSearch(q){
  const R=$("#results"); q=q.trim().toLowerCase();
  if(q.length<2){R.classList.remove("show");return;}
  const words=q.split(/\s+/).filter(Boolean);
  const out=[];
  IDX.forEach(x=>{
    const b=x.body.toLowerCase(); let s=0;
    for(const w of words){const inN=x.name.includes(w), inB=b.includes(w); if(!inN&&!inB){s=-1;break;} s+=inN?10:1;}
    if(s>0){let snip="";const w=words.find(w=>!x.name.includes(w))||words[0];const p=b.indexOf(w);if(p>=0){const st=Math.max(0,p-50);snip=(st?"…":"")+x.body.slice(st,p+90)+"…";}else snip=x.d.ov.slice(0,120)+"…";out.push({x,s,snip});}
  });
  out.sort((a,b)=>b.s-a.s);
  const hl=t=>{let r=esc(t);words.forEach(w=>{r=r.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");});return r;};
  R.innerHTML=out.length?out.slice(0,12).map((o,i)=>`<div class="res" data-id="${o.x.d.id}"><b>${hl(o.x.d.name)}</b><small>${esc(o.x.d.area.short)} · ${hl(o.snip)}</small></div>`).join(""):`<div class="res"><small>No matches for "${esc(q)}".</small></div>`;
  R.classList.add("show"); sel=-1;
}
function goRes(id){$("#results").classList.remove("show");$("#q").value="";location.hash="d-"+id;}

/* ---------- Router ---------- */
function route(){
  const h=location.hash.slice(1);
  document.querySelectorAll(".toplinks a").forEach(a=>a.classList.toggle("on",a.dataset.v===(h||"home")));
  if(h.startsWith("d-")&&D[h.slice(2)])disease(D[h.slice(2)]);
  else if(h.startsWith("a-")&&AREAS.find(a=>a.id===h.slice(2)))area(AREAS.find(a=>a.id===h.slice(2)));
  else if(h==="symptoms")symptoms(); else if(h==="updates")updates(); else if(h==="about")about(); else home();
  window.scrollTo(0,0);
}
buildSide();
window.addEventListener("hashchange",route);
view.addEventListener("click",e=>{const j=e.target.closest("[data-jump]");if(j){e.preventDefault();const t=document.getElementById(j.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth"});}});
const qi=$("#q");
qi.addEventListener("input",()=>doSearch(qi.value));
qi.addEventListener("keydown",e=>{const items=[...document.querySelectorAll(".res[data-id]")];if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=(sel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle("on",i===sel));}else if(e.key==="Enter"){const it=items[sel>=0?sel:0];if(it)goRes(it.dataset.id);}else if(e.key==="Escape"){$("#results").classList.remove("show");qi.blur();}});
$("#results").addEventListener("click",e=>{const r=e.target.closest(".res[data-id]");if(r)goRes(r.dataset.id);});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("#results").classList.remove("show");});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus();}});
$("#navbtn").onclick=()=>document.body.classList.toggle("nav");
$("#scrim").onclick=()=>document.body.classList.remove("nav");
route();
</script>
</body>
